# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tidewake

before:
  hooks:
    - go mod tidy
    - go test -count=1 ./...

builds:
  - id: tidewake
    main: ./cmd/tidewake
    binary: tidewake
    env:
      - CGO_ENABLED=0
    # macOS only for now; the Linux collector is not implemented yet.
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

release:
  # v0.1.0-rc1 and similar tags publish as pre-releases.
  prerelease: auto

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^rules-watch:"]

homebrew_casks:
  - name: tidewake
    binaries: [tidewake]
    homepage: https://github.com/berkkorkmaz/tidewake
    description: Find what Claude Code and Codex sessions left behind
    repository:
      owner: berkkorkmaz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The binary is not notarized yet, so Gatekeeper would block its first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tidewake"]
          end
