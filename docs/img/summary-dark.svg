<svg xmlns="http://www.w3.org/2000/svg" width="760" height="92" viewBox="0 0 760 92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What agents leave behind">
