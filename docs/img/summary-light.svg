<svg xmlns="http://www.w3.org/2000/svg" width="760" height="92" viewBox="0 0 760 92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="tidewake on one developer Mac">
<title>What one tidewake scan found on one developer Mac</title>
<rect x="0.0" y="0" width="181.0" height="92" rx="10" fill="#f3f2ef"/>
<text x="18.0" y="44" font-size="28" font-weight="650" fill="#0b0b0b">30.5 GB</text>
<text x="18.0" y="72" font-size="13" fill="#52514e">disk that can be freed</text>
<rect x="193.0" y="0" width="181.0" height="92" rx="10" fill="#f3f2ef"/>
<text x="211.0" y="44" font-size="28" font-weight="650" fill="#0b0b0b">303 MB</text>
<text x="211.0" y="72" font-size="13" fill="#52514e">RAM held by leftovers</text>
<rect x="386.0" y="0" width="181.0" height="92" rx="10" fill="#f3f2ef"/>
<text x="404.0" y="44" font-size="28" font-weight="650" fill="#0b0b0b">24</text>
<text x="404.0" y="72" font-size="13" fill="#52514e">worktrees kept on purpose</text>
<rect x="579.0" y="0" width="181.0" height="92" rx="10" fill="#f3f2ef"/>
<text x="597.0" y="44" font-size="28" font-weight="650" fill="#0b0b0b">1</text>
<text x="597.0" y="72" font-size="13" fill="#52514e">session stuck for 3 days</text>
</svg>